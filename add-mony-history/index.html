<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1E3932">
  <title>লেনদেনের বিবরণ - Share Market BD</title>
  <link rel="icon" href="https://img.icons8.com/ios-filled/100/02c8d3/financial-growth-analysis.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

    :root {
      --main-color: #02c8d3;
      --color-primary: #000000;
      --color-primary-dark: #000000;
      --color-page-bg: #F2F0EB;
      --color-card-bg: #ffffff;
      --color-text: #000000;
      --color-text-muted: #666;
      --color-app-bg: #ffffff;
      --gradient-btn: var(--main-color);
      --gradient-card: var(--main-color);
      --page-surface-bg: linear-gradient(180deg, #F2F0EB 0%, #F2F0EB 100%), #F2F0EB;
      --color-primary-soft: rgba(0, 112, 74, 0.08);
      --color-success: #2E7D32;
      --color-danger: #C62828;
      --color-warning: #EF6C00;
      font-size: 17.0667px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Noto Sans Bengali', Arial, sans-serif; background: #000000; color: var(--color-text); min-height: 100vh; }
    body { display: flex; justify-content: center; }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }

    .layout {
      width: 100%;
      max-width: 400px;
      min-height: 100vh;
      background: var(--page-surface-bg);
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* NAVBAR */
    .app-nav { position: sticky; top: 0; z-index: 50; }
    .app-nav__bar { background: #000000; color: #fff; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .app-nav__back { background: none; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
    .app-nav__back:hover { background: rgba(255,255,255,0.1); }
    .app-nav__title { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
    .app-nav__spacer { width: 32px; }

    /* PAGE */
    .history-page { padding: 16px 12px 40px 12px; min-height: calc(100vh - 52px); }

    /* BALANCE CARD (নগদ স্টাইল) */
    .balance-card {
      background: linear-gradient(135deg, var(--main-color), #019ba3);
      border-radius: 20px;
      padding: 24px 20px;
      color: #fff;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(2, 200, 211, 0.3);
      position: relative;
      overflow: hidden;
    }
    .balance-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -40px;
      width: 160px;
      height: 160px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    .balance-card__label {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 1;
    }
    .balance-card__amount {
      font-size: 32px;
      font-weight: 800;
      display: flex;
      align-items: baseline;
      gap: 6px;
      position: relative;
      z-index: 1;
    }
    .balance-card__amount span { font-size: 22px; }
    .balance-card__info {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.85;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 12px;
      position: relative;
      z-index: 1;
    }

    /* FILTER TABS */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 8px 16px;
      background: #fff;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-muted);
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid #e0e0e0;
      transition: all 0.2s;
    }
    .filter-tab--active {
      background: var(--main-color);
      color: #fff;
      border-color: var(--main-color);
      box-shadow: 0 4px 12px rgba(2, 200, 211, 0.3);
    }

    /* TRANSACTION LIST */
    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .txn-date-group {
      margin-bottom: 4px;
    }
    .txn-date-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      padding: 6px 4px;
      margin-top: 8px;
    }

    .txn-item {
      background: #fff;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #f0f0f0;
      transition: transform 0.15s;
      margin-bottom: 8px;
    }
    .txn-item:active { transform: scale(0.98); }

    .txn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .txn-icon--deposit { background: #E8F5E9; color: var(--color-success); }
    .txn-icon--withdraw { background: #FFEBEE; color: var(--color-danger); }
    .txn-icon--purchase { background: #FFF3E0; color: var(--color-warning); }
    .txn-icon--bonus { background: #E3F2FD; color: #1565C0; }
    .txn-icon--default { background: #F5F7FA; color: #555; }

    .txn-info { flex: 1; min-width: 0; }
    .txn-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .txn-sub {
      font-size: 11px;
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .txn-amount {
      font-size: 15px;
      font-weight: 800;
      text-align: right;
      flex-shrink: 0;
    }
    .txn-amount--plus { color: var(--color-success); }
    .txn-amount--minus { color: var(--color-danger); }
    .txn-time {
      font-size: 10px;
      color: var(--color-text-muted);
      text-align: right;
      margin-top: 2px;
    }

    /* LOADING & EMPTY */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      color: var(--color-text-muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f0f0f0;
      border-top-color: var(--main-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      color: var(--color-text-muted);
      text-align: center;
    }
    .empty-state svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.4; }

    /* TOAST */
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(30, 57, 50, 0.95); color: #fff; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 9999; transition: all 0.3s; max-width: 85vw; text-align: center; opacity: 0; pointer-events: none; }
    .toast--show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  <div class="layout">
    <!-- NAVBAR -->
    <div class="app-nav">
      <div class="app-nav__bar">
        <button class="app-nav__back" onclick="goBack()">‹</button>
        <div class="app-nav__title">লেনদেনের বিবরণ</div>
        <div class="app-nav__spacer"></div>
      </div>
    </div>

    <!-- PAGE -->
    <div class="history-page">
      <!-- BALANCE CARD -->
      <div class="balance-card" id="balanceCard">
        <div class="balance-card__label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          মোট ব্যালেন্স
        </div>
        <div class="balance-card__amount" id="balanceAmount"><span>৳</span> 0</div>
        <div class="balance-card__info">
          <span id="userMobileDisplay">—</span>
          <span id="txnCountDisplay">0 লেনদেন</span>
        </div>
      </div>

      <!-- FILTER TABS -->
      <div class="filter-tabs" id="filterTabs">
        <div class="filter-tab filter-tab--active" data-filter="all" onclick="setFilter('all')">সব</div>
        <div class="filter-tab" data-filter="deposit" onclick="setFilter('deposit')">ডিপোজিট</div>
        <div class="filter-tab" data-filter="purchase" onclick="setFilter('purchase')">ইনভেস্ট</div>
        <div class="filter-tab" data-filter="withdraw" onclick="setFilter('withdraw')">উইথড্র</div>
        <div class="filter-tab" data-filter="bonus" onclick="setFilter('bonus')">বোনাস</div>
      </div>

      <!-- TRANSACTION LIST -->
      <div class="transaction-list" id="transactionList">
        <div class="loading-state">
          <div class="spinner"></div>
          <div>লোড হচ্ছে...</div>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>
  </div>

  <!-- ============================================================ -->
  <!-- JavaScript Logic (Frontend) -->
  <!-- ============================================================ -->
  <script>
    (function() {
      'use strict';

      // আপনার তৈরি করা API এর এন্ডপয়েন্ট
      const API_ENDPOINT = '/api/add-mony-history'; 

      let currentUser = null;
      let allTransactions = [];
      let currentFilter = 'all';

      const fmt = (n) => Number(n || 0).toLocaleString('en-US');
      const pad2 = (n) => String(n).padStart(2, '0');

      function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
      }

      function formatTime(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        let h = d.getHours();
        const m = pad2(d.getMinutes());
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return h + ':' + m + ' ' + ampm;
      }

      function getDateGroupLabel(iso) {
        if (!iso) return 'অজানা তারিখ';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return 'অজানা তারিখ';
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        const yest = new Date(today);
        yest.setDate(yest.getDate() - 1);
        
        const target = new Date(d);
        target.setHours(0, 0, 0, 0);

        if (target.getTime() === today.getTime()) return 'আজ';
        if (target.getTime() === yest.getTime()) return 'গতকাল';
        return formatDate(iso);
      }

      function showToast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('toast--show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => t.classList.remove('toast--show'), 2500);
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // ============================================================
      // FETCH USER DATA (VIA VERCEL SERVERLESS API)
      // ============================================================
      async function fetchUserData(mobile) {
        try {
          const res = await fetch(`${API_ENDPOINT}?mobile=${mobile}`);
          const data = await res.json();

          if (data.success) {
            return {
              mobile: data.mobile,
              balance: data.balance || 0,
              amountHistory: data.amountHistory || {},
              uid: data.uid || null,
            };
          } else {
            console.warn('API Error:', data.error);
            return null;
          }
        } catch (e) {
          console.error('Fetch Error:', e);
          return null;
        }
      }

      // ============================================================
      // PARSE TRANSACTIONS
      // ============================================================
      function parseTransactions(history) {
        if (!history || typeof history !== 'object') return [];
        const list = [];

        Object.keys(history).forEach((key) => {
          const item = history[key];
          if (!item || typeof item !== 'object') return;
          if (key === 'time') return; // Invalid key skip

          const amount = Number(item.amount || 0);
          const type = (item.type || '').toLowerCase();
          const info = item.info || '';
          const time = item.time || null;

          let category = 'default';
          let title = info || 'লেনদেন';
          let isPlus = false;

          if (type === 'purchase' || /purchase/i.test(info)) {
            category = 'purchase';
            title = 'ইনভেস্ট';
            isPlus = false;
          } else if (/deposit/i.test(info) || item.provider) {
            category = 'deposit';
            title = 'ডিপোজিট' + (item.provider ? ' (' + item.provider + ')' : '');
            isPlus = true;
          } else if (/withdraw/i.test(info)) {
            category = 'withdraw';
            title = 'উইথড্র';
            isPlus = false;
          } else if (/bonus|commission|refer/i.test(info)) {
            category = 'bonus';
            title = info || 'বোনাস';
            isPlus = true;
          } else if (/signup/i.test(info)) {
            category = 'bonus';
            title = 'সাইনআপ বোনাস';
            isPlus = true;
          }

          list.push({
            id: key,
            amount: amount,
            category: category,
            title: title,
            time: time,
            isPlus: isPlus,
            trxId: item.trx_id || key,
          });
        });

        list.sort((a, b) => {
          const ta = a.time ? new Date(a.time).getTime() : 0;
          const tb = b.time ? new Date(b.time).getTime() : 0;
          return tb - ta;
        });

        return list;
      }

      // ============================================================
      // RENDER UI
      // ============================================================
      function renderBalance(user) {
        const balEl = document.getElementById('balanceAmount');
        const mobEl = document.getElementById('userMobileDisplay');
        const cntEl = document.getElementById('txnCountDisplay');
        
        if (balEl) balEl.innerHTML = '<span>৳</span> ' + fmt(user.balance);
        if (mobEl) mobEl.textContent = user.mobile;
        if (cntEl) cntEl.textContent = allTransactions.length + ' লেনদেন';
      }

      function getIconSvg(category) {
        switch (category) {
          case 'deposit':
            return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>';
          case 'withdraw':
            return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';
          case 'purchase':
            return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
          case 'bonus':
            return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>';
          default:
            return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
        }
      }

      function renderTransactionList() {
        const listEl = document.getElementById('transactionList');
        if (!listEl) return;

        let filtered = allTransactions;
        if (currentFilter !== 'all') {
          filtered = allTransactions.filter(t => t.category === currentFilter);
        }

        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="empty-state">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M3 7h18v13H3z"/><path d="M3 7l2-4h14l2 4"/><path d="M9 12h6"/>' +
            '</svg>' +
            '<div>কোনো লেনদেন পাওয়া যায়নি</div>' +
          '</div>';
          return;
        }

        const groups = {};
        filtered.forEach(t => {
          const key = t.time ? new Date(t.time).toDateString() : 'unknown';
          if (!groups[key]) groups[key] = [];
          groups[key].push(t);
        });

        const sortedKeys = Object.keys(groups).sort((a, b) => {
          if (a === 'unknown') return 1;
          if (b === 'unknown') return -1;
          return new Date(b).getTime() - new Date(a).getTime();
        });

        let html = '';
        sortedKeys.forEach(k => {
          const items = groups[k];
          const label = k === 'unknown' ? 'অজানা তারিখ' : getDateGroupLabel(items[0].time);
          
          html += '<div class="txn-date-group">';
          html += '<div class="txn-date-label">' + label + '</div>';
          
          items.forEach(t => {
            const iconCls = 'txn-icon--' + t.category;
            const amtCls = t.isPlus ? 'txn-amount--plus' : 'txn-amount--minus';
            const sign = t.isPlus ? '+' : '−';
            
            html += '' +
              '<div class="txn-item">' +
                '<div class="txn-icon ' + iconCls + '">' + getIconSvg(t.category) + '</div>' +
                '<div class="txn-info">' +
                  '<div class="txn-title">' + escapeHtml(t.title) + '</div>' +
                  '<div class="txn-sub">' + escapeHtml(t.trxId) + '</div>' +
                '</div>' +
                '<div>' +
                  '<div class="txn-amount ' + amtCls + '">' + sign + ' ৳' + fmt(t.amount) + '</div>' +
                  '<div class="txn-time">' + formatTime(t.time) + '</div>' +
                '</div>' +
              '</div>';
          });
          html += '</div>';
        });

        listEl.innerHTML = html;
      }

      window.setFilter = function(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-tab').forEach(el => {
          el.classList.toggle('filter-tab--active', el.getAttribute('data-filter') === filter);
        });
        renderTransactionList();
      };

      window.goBack = function() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '/';
        }
      };

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const mobile = params.get('user');

        if (!mobile) {
          document.getElementById('transactionList').innerHTML =
            '<div class="empty-state"><div>ইউজার পাওয়া যায়নি। অনুগ্রহ করে লগইন করুন।</div></div>';
          showToast('ইউজার পাওয়া যায়নি');
          return;
        }

        if (!/^01\d{9}$/.test(mobile)) {
          document.getElementById('transactionList').innerHTML =
            '<div class="empty-state"><div>সঠিক মোবাইল নম্বর নয়</div></div>';
          return;
        }

        currentUser = { mobile: mobile, balance: 0 };
        renderBalance(currentUser);

        const userData = await fetchUserData(mobile);
        if (!userData) {
          document.getElementById('transactionList').innerHTML =
            '<div class="empty-state"><div>ডেটা লোড করতে সমস্যা হয়েছে</div></div>';
          showToast('ডেটা লোড ব্যর্থ');
          return;
        }

        currentUser = userData;
        allTransactions = parseTransactions(userData.amountHistory);

        renderBalance(currentUser);
        renderTransactionList();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
