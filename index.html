<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <style>
        body {
            background: #e8ebef;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* কার্ডের ডিজাইন (আপনার স্ক্রিনশটের মতো) */
        .my-order-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            border-left: 5px solid #000;
        }

        .my-order-card:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
            color: #555;
        }

        .card-body span {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #111;
            margin-top: 2px;
        }

        /* মোডাল ডিজাইন */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #555;
        }

        .modal-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #067a54;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        /* অতিবাহিত তারিখ (লাল/ধূসর) */
        .past-date {
            background-color: #ffe6e6;
            color: #d32f2f;
        }

        /* আজকের তারিখ (হলুদ) */
        .today-date {
            background-color: #fff9c4;
            color: #f57f17;
        }

        /* ভবিষ্যতের তারিখ (সবুজ) */
        .future-date {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <!-- উদাহরণস্বরূপ কার্ড (আপনার ডাইনামিক কার্ডে data-order-id থাকতে হবে) -->
    <div class="my-order-card" data-order-id="ORD_1795354391434">
        <div class="card-header">
            <span>VIP 1</span>
            <span style="color: #777;">22/11/2026</span>
        </div>
        <div class="card-body">
            <div>বিনিয়োগ <span>৳ 1,000</span></div>
            <div>দৈনিক আয় <span>৳ 250</span></div>
            <div>মোট আয় <span>৳ 25,000</span></div>
            <div>অর্ডার আইডি <span>ORD_1795354391434</span></div>
        </div>
    </div>

    <div class="my-order-card" data-order-id="ORD_1795354391434">
        <div class="card-header">
            <span>VIP 3</span>
            <span style="color: #777;">22/11/2026</span>
        </div>
        <div class="card-body">
            <div>বিনিয়োগ <span>৳ 6,000</span></div>
            <div>দৈনিক আয় <span>৳ 1,666</span></div>
            <div>মোট আয় <span>৳ 166,600</span></div>
            <div>অর্ডার আইডি <span>ORD_1795354391434</span></div>
        </div>
    </div>

    <!-- Modal for Product History -->
    <div id="productHistoryModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <div class="modal-title" id="modalProductName">Product History</div>
            <ul class="history-list" id="historyList">
                <!-- Data will be injected here -->
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // URL থেকে user বের করা (ধরে নিচ্ছি আপনার URL-এ ?user=01325475745 আছে)
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user') || '01325475745'; // টেস্টের জন্য ডিফল্ট
            
            const productHistoryModal = document.getElementById('productHistoryModal');
            const closeModal = document.getElementById('closeModal');
            const modalProductName = document.getElementById('modalProductName');
            const historyList = document.getElementById('historyList');
            
            // সব কার্ড সিলেক্ট করা
            const orderCards = document.querySelectorAll('.my-order-card');
            
            orderCards.forEach(card => {
                card.addEventListener('click', async () => {
                    // কার্ড থেকে data-order-id নেওয়া
                    const orderId = card.getAttribute('data-order-id');
                    
                    if (!orderId) {
                        console.error("Order ID not found on this card!");
                        return;
                    }

                    // মোডাল ওপেন করে লোডিং দেখানো
                    productHistoryModal.style.display = 'flex';
                    modalProductName.textContent = 'লোডিং...';
                    historyList.innerHTML = '<li style="text-align:center; color:#555;">অপেক্ষা করুন...</li>';

                    try {
                        // API কল করা
                        const response = await fetch(`/api/order-products-dat?user_id=${user}&order_id=${orderId}`);
                        const data = await response.json();

                        if (data.status === 'success') {
                            modalProductName.textContent = `${data.product_name} এর আয়ের ইতিহাস`;
                            historyList.innerHTML = '';

                            const autoData = data.auto_data;
                            
                            // আজকের তারিখ (yyyy-MM-dd) বের করা
                            const now = new Date();
                            const bdTime = new Date(now.getTime() + (6 * 60 * 60 * 1000));
                            const todayStr = `${bdTime.getUTCFullYear()}-${String(bdTime.getUTCMonth() + 1).padStart(2, '0')}-${String(bdTime.getUTCDate()).padStart(2, '0')}`;

                            // তারিখগুলোকে সর্ট করা
                            const sortedDates = Object.keys(autoData).sort();

                            if (sortedDates.length === 0) {
                                historyList.innerHTML = '<li style="text-align:center; color:#555;">কোনো ডাটা পাওয়া যায়নি।</li>';
                            } else {
                                sortedDates.forEach(dateStr => {
                                    const taka = autoData[dateStr].taka;
                                    const li = document.createElement('li');
                                    li.className = 'history-item';

                                    // রঙের পার্থক্য করা
                                    if (dateStr < todayStr) {
                                        li.classList.add('past-date'); 
                                    } else if (dateStr === todayStr) {
                                        li.classList.add('today-date'); 
                                    } else {
                                        li.classList.add('future-date'); 
                                    }

                                    li.innerHTML = `
                                        <span>${dateStr}</span>
                                        <span>৳ ${taka}</span>
                                    `;

                                    historyList.appendChild(li);
                                });
                            }
                        } else {
                            modalProductName.textContent = 'সমস্যা হয়েছে';
                            historyList.innerHTML = `<li style="text-align:center; color:red;">${data.message}</li>`;
                        }
                    } catch (error) {
                        modalProductName.textContent = 'সমস্যা হয়েছে';
                        historyList.innerHTML = '<li style="text-align:center; color:red;">সার্ভারে সমস্যা হয়েছে।</li>';
                    }
                });
            });

            // মোডাল বন্ধ করার লজিক
            closeModal.addEventListener('click', () => {
                productHistoryModal.style.display = 'none';
            });

            window.addEventListener('click', (event) => {
                if (event.target === productHistoryModal) {
                    productHistoryModal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
