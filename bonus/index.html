  <script>
    const API_ENDPOINT = '/api/bonus';
    let currentUserMobile = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('toast--show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove('toast--show'), 3000);
    }

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }

    function applyDynamicIconColors() {
      const mainColor = getComputedStyle(document.documentElement).getPropertyValue('--main-color').trim();
      const hexColor = mainColor.replace('#', ''); 
      const img = document.getElementById('bonusIcon');
      if(img) {
          img.src = `https://img.icons8.com/ios-filled/100/${hexColor}/money-bag.png`;
      }
    }

    // API থেকে বোনাস এমাউন্ট লোড করা
    async function loadBonusAmount() {
      const displayEl = document.getElementById('bonusAmountDisplay');
      displayEl.textContent = '৳ ...';
      
      try {
        const res = await fetch(API_ENDPOINT); // GET Request
        const data = await res.json();
        
        if (data.success && data.amount) {
          displayEl.textContent = '৳ ' + data.amount;
        } else {
          displayEl.textContent = '৳ 10'; // Fallback
        }
      } catch (e) {
        console.error(e);
        displayEl.textContent = '৳ 10';
      }
    }

    async function claimBonus() {
      if (!currentUserMobile) {
        showToast('ইউজার পাওয়া যায়নি। আবার লগইন করুন।');
        return;
      }

      const btn = document.getElementById('claimBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      btn.disabled = true;
      btnText.textContent = 'অপেক্ষা করুন...';
      btnSpinner.style.display = 'block';

      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobile: currentUserMobile })
        });

        const data = await res.json();

        if (data.success) {
          showToast('সফলভাবে বোনাস গ্রহণ করা হয়েছে!');
          btnText.textContent = 'আজকের বোনাস নেওয়া হয়েছে';
        } else {
          showToast(data.error || 'বোনাস নিতে সমস্যা হয়েছে');
          btn.disabled = false;
          btnText.textContent = 'আবার চেষ্টা করুন';
        }
      } catch (err) {
        console.error(err);
        showToast('সার্ভার সমস্যা, পরে চেষ্টা করুন');
        btn.disabled = false;
        btnText.textContent = 'আবার চেষ্টা করুন';
      } finally {
        btnSpinner.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyDynamicIconColors();
      loadBonusAmount(); // এমাউন্ট লোড করবে
      
      const params = new URLSearchParams(window.location.search);
      currentUserMobile = params.get('user');

      if (!currentUserMobile) {
        showToast('ইউজার পাওয়া যায়নি');
        document.getElementById('claimBtn').disabled = true;
        document.getElementById('btnText').textContent = 'লগইন করুন';
      }
    });
  </script>
